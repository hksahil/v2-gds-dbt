version: 2

sources:
  - name: tpch
    description: 'tpch sample data hosted in snowflake'
    database: SNOWFLAKE_SAMPLE_DATA
    schema: TPCH_SF1
    tables:
      - name: customer
        description: 'Customer master table'
      - name: lineitem
        description: 'Individual lines present in order'
      - name: nation
        description: 'Nation master data'
      - name: orders
        description: 'Transaction table present at order granuality'
      - name: part
        description: 'Item Parts master table'
      - name: partsupp
        description: 'Parts supplied and their metadata'
      - name: supplier
        description: 'Supplier master table'
      - name: region
        description: 'Region master table'